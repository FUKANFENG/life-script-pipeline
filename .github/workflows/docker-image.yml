name: Story workflow Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: agent
            dockerfile: docker/Dockerfile.agent
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name
        id: image
        shell: pwsh
        run: |
          $image = "ghcr.io/$('${{ github.repository }}'.ToLower())-${{ matrix.name }}"
          "name=$image" >> $env:GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=story-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=story-${{ matrix.name }}
