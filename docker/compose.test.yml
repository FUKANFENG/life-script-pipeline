services:
  app:
    environment:
      XG_API_BASE_URL: http://xg-mock:18080
      XG_API_KEY: docker-smoke-test-only
    depends_on:
      xg-mock:
        condition: service_healthy
  xg-mock:
    image: life-script-agent:cpu
    command: ["python", "/app/docker/smoke-test.py", "--xg-mock"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 18080), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
